# vim:fileencoding=utf-8:ft=kitty

# Included by quick-access-terminal.conf as quick-access-terminal.${KITTY_OS}.conf.

# Margins track Moom's grid gap, so the panel is inset as far as a Moom-placed
# window. geninclude reads it when the panel is created, which is once per
# login; the gap is per display configuration, so display-profile pushes the new
# value into the running panel when displays change.
geninclude quick-access-margins

# The corner and the fade-in, both of which are shader work because kitty has
# no option for either on a panel: macOS rounds an ordinary window's corners and
# leaves a panel square, and nothing animates a panel being shown. See
# shaders/panel.pipeline.
#
# Set here rather than in kitty.conf so it only ever applies to the panel. Run
# against a window macOS has already rounded, the corner shader would clip a
# second corner inside the first.
kitty_override custom_shaders=panel

# Below Mission Control, above ordinary windows. `layer overlay` in the shared
# file would otherwise map to something above Mission Control, which left it
# painting over the space switcher; `layer` still has to say overlay for Linux,
# and setting this overrides the mapping on macOS only, which is what the OS
# split is for.
#
# NSNormalWindowLevel was tried and cannot work, which is worth stating plainly
# because it is the obvious thing to reach for. The panel's bundle is
# LSBackgroundOnly, so the application can never *become active*; at a raised
# level its window takes key status anyway, and at an ordinary level nothing can
# give it focus at all. Shown from an ordinary level it appears and keystrokes
# keep going to whatever was already frontmost, so ⌥⇥ puts a terminal on screen
# that cannot be typed into until it is clicked.
#
# Checked against every route there is, all of them with the panel visible and
# another application frontmost: `kitty @ resize-os-window --action show`,
# `kitten quick-access-terminal`'s own toggle, `open -b
# net.kovidgoyal.kitty-quick-access`, and Hammerspoon's `app:activate(true)`
# (which returns true and changes nothing). At this level the first of those
# does bring it forward.
#
# The cost is that it covers ordinary windows while it is up, which is what ⌥⇥
# is for.
kitty_override macos_ns_window_layer=NSFloatingWindowLevel

# Three things learned here, all easy to try twice:
#
# There is no Dock icon and there should not be one. The nested bundle is
# LSBackgroundOnly, which is what suppresses both the Dock tile and ⌘⇥, and it
# is the same property that stops the application ever becoming active. It is
# not a kitty setting, and editing that Info.plist would break kitty.app's
# signature and be reverted by the next cask upgrade.
#
# Giving it one anyway, by putting a stub launcher in the Dock, would undo the
# point of the panel. A Dock tile means a regular application, and a regular
# application is the thing that carries "Assign To → All Desktops" — the setting
# macOS kept dropping, which is what made ⌥⇥ drag kitty's window across spaces
# instead of showing it on the current one. A panel has no space assignment to
# lose. Trading that back for an icon is the bug, not a feature.
#
# Hiding the panel for Mission Control cannot work. Mission Control composites
# the screen as it opens, so a panel hidden after that is still in the composite
# and only disappears once Mission Control exits. The hiding itself was fine — a
# Hammerspoon application watcher does see kitty-quick-access deactivate when
# Mission Control opens, where kitty's own hide_on_focus_loss does not, and the
# hide landed every time, just too late to matter.
#
# The panel's application is named kitty-quick-access, with the bundle
# identifier net.kovidgoyal.kitty-quick-access, because the kitten runs from a
# nested bundle inside kitty.app. That is what the Karabiner conditions match
# on, it is why the autohide list's "kitty" entry never applied to the panel,
# and hs.application.find() cannot find it by that name even so.

# To draw under the menu bar and Dock rather than inside the visible frame:
# kitty_override macos_use_physical_screen_frame=yes
