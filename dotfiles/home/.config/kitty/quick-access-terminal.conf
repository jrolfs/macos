# vim:fileencoding=utf-8:ft=kitty

# The kitty half of the ⌥⇥ terminal, and the only kitty there is: this panel
# replaces the ordinary window that ⌥⇥ used to show and hide, so it loads the
# normal kitty.conf, startup session and all, and nothing here cuts it down to a
# scratch terminal. The first ⌥⇥ after a login creates it, every one after that
# toggles it.
#
# It replaces two Karabiner manipulators that did the job with `open -a
# kitty.app` and a Finder `set visible of process "kitty" to false`, switched on
# a frontmost-application condition. That pair only behaved like an all-spaces
# terminal because kitty.app was assigned to All Desktops in the Dock, an
# assignment macOS keeps dropping: once it was gone, ⌥⇥ pulled the window to
# whichever space it was last on instead of showing it on the current one, and
# the only fix was toggling the setting by hand. A panel is not an ordinary
# window and has no space assignment to lose.
#
# Karabiner's binding backgrounds the command with a plain `&` rather than
# passing the kitten's own --detach, which on macOS 0.49.1 exits 0 and starts
# nothing at all: no process, no socket, and an empty --detached-log. `&` leaves
# the panel reparented to launchd, which is what --detach was there for.
#
# Nothing should launch kitty.app directly any more. A normal launch is a
# separate single-instance group, so it would come up as a second instance with
# a second socket, and the newest-socket pick in display-profile and in the `kfs`
# shell function would start landing on whichever of the two was younger.

# Anchored to all four sides, inset by the margins the macOS include sets, so
# the panel lands where Moom would put a zoomed window. `lines` and `columns`
# are ignored for this edge.
#
# For a drop-down over the top of the screen instead, which uses the same
# margins to line its edges up with tiled windows:
#
#   edge top
#   lines 25
edge center

# The highest of the four layers, so the panel stays above every other window
# for as long as it is up. On macOS the exact NSWindow level this maps to is then
# pulled back down by the macOS include, which has the reason why.
layer overlay

# Replaces the "kitty" entry that used to sit in the autohide list in
# .hammerspoon/init.lua, which hid kitty on every deactivation by way of a
# System Events `set visible of process` and then force-reactivated whatever had
# taken focus. Same behaviour, done by kitty: no System Events, no TCC grant,
# and nothing reaching in to re-activate another app, which is what made that
# module fight the other windows it was hiding.
#
# Note that this does not cover Mission Control or App Exposé. Neither makes
# kitty see a keyboard focus loss, so the panel stays up through both; what
# keeps them usable is the window level set in the macOS include, not this.
hide_on_focus_loss yes

# No `listen_on` or `allow_remote_control` override here on purpose. Both are
# inherited from kitty.conf so the socket keeps the name everything else already
# looks for: the newest ~/.local/share/kitty/socket* is how display-profile sets
# the font size, how the `kfs` function does, and how the startup session reaches
# itself to run `goto_session`.

# KITTY_OS is kitty's own variable, `macos`, `linux` or `bsd`. It is the only OS
# switch a kitty config file gets; anything finer has to be a nix conditional.
include quick-access-terminal.${KITTY_OS}.conf
