# kitty's macOS ⌘ shortcuts, on Linux.
#
# The Linux desktop remaps ⌘+letter to Ctrl+letter for every app except
# kitty, where Ctrl+C has to stay an interrupt (see layout.kbd in
# modules/nixos/desktop). So kitty receives ⌘ as Super, and these give it the
# same meanings it has by default on the Mac.

map super+c         copy_to_clipboard
map super+v         paste_from_clipboard
map super+t         new_tab
map super+w         close_window
map super+shift+w   close_os_window
map super+n         new_os_window
map super+q         quit
map super+k         clear_terminal to_cursor active

map super+equal     change_font_size all +2.0
map super+plus      change_font_size all +2.0
map super+minus     change_font_size all -2.0
map super+0         change_font_size all 0

map super+shift+]   next_tab
map super+shift+[   previous_tab
map super+1         goto_tab 1
map super+2         goto_tab 2
map super+3         goto_tab 3
map super+4         goto_tab 4
map super+5         goto_tab 5
map super+6         goto_tab 6
map super+7         goto_tab 7
map super+8         goto_tab 8
map super+9         goto_tab 9
