# vim:fileencoding=utf-8:ft=kitty

# Included by quick-access-terminal.conf as quick-access-terminal.${KITTY_OS}.conf.
# It has to exist even though irulan is headless, or the include warns.

# `top` rather than the `overlay` the shared file sets: an overlay-layer panel
# does not interoperate with IME systems under Wayland.
layer top

# No margins. The gap they follow on macOS is a Moom setting, and Moom is
# macOS-only.
